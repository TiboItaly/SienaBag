<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SienaBag — 4 interfaces (client · commerçant · coursier · admin)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { font-family: -apple-system, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 30% 20%, #2b2420 0%, #171310 60%, #0d0b09 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 12px; gap: 16px;
  }
  .caption { color: #d8c9b8; font-size: 13px; letter-spacing: 0.04em; text-align: center; }
  .caption b { color: #f2e5d0; font-size: 14px; letter-spacing: 0.06em; }
  .roles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .role-pill { padding: 9px 16px; border-radius: 999px; border: 1px solid #4a4038; color: #d8c9b8; font-size: 12.5px; cursor: pointer; background: rgba(255,255,255,.04); user-select: none; }
  .role-pill.on { background: #f2e5d0; color: #23180f; font-weight: 700; border-color: #f2e5d0; }

  .phone {
    width: 384px; height: 800px;
    border-radius: 54px; padding: 11px;
    background: linear-gradient(160deg, #3f3831, #1d1a17 40%, #2c2620);
    box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06) inset;
  }
  .screen {
    width: 100%; height: 100%; border-radius: 44px; overflow: hidden;
    background: #faf6ef; display: flex; flex-direction: column; position: relative;
    --accent: #b3552d; --accent-2: #94401f; --soft: #f6e5d8; --accent-ink: #23180f;
  }
  .screen.role-partner { --accent: #2e6b3f; --accent-2: #1f4d2e; --soft: #e2efdd; --accent-ink: #173a24; }
  .screen.role-courier { --accent: #2456a8; --accent-2: #183f7e; --soft: #dbe6f7; --accent-ink: #12294f; }
  .screen.role-admin { --accent: #6b3fa0; --accent-2: #522c7e; --soft: #ece1f6; --accent-ink: #2c1a42; background: #f7f4fa; }

  .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 112px; height: 26px; background: #171310; border-radius: 14px; z-index: 60; }
  .statusbar {
    height: 44px; flex: 0 0 44px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px 0 30px; font-size: 13px; font-weight: 600; color: var(--accent-ink); z-index: 50; position: relative;
  }
  .statusbar .icons { display: flex; gap: 5px; align-items: center; }

  .content { flex: 1; overflow-y: auto; padding: 8px 18px 18px; scrollbar-width: none; }
  .content::-webkit-scrollbar { display: none; }

  .tabbar { flex: 0 0 74px; display: flex; align-items: center; justify-content: space-around; background: #fffdf9; border-top: 1px solid #eee1cf; padding-bottom: 12px; }
  .screen.role-admin .tabbar { background: #fdfbff; border-top-color: #e6dced; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #a08c74; cursor: pointer; user-select: none; }
  .tab svg { width: 22px; height: 22px; }
  .tab.active { color: var(--accent); font-weight: 600; }

  /* ---------- shared ---------- */
  h1 { font-size: 22px; color: var(--accent-ink); letter-spacing: -0.01em; }
  h2 { font-size: 16px; color: var(--accent-ink); }
  .muted { color: #8d7c66; font-size: 12.5px; line-height: 1.45; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--accent-ink); margin: 18px 0 9px; display: flex; justify-content: space-between; align-items: baseline; }
  .section-title span { font-size: 11px; color: var(--accent); font-weight: 600; }

  .cta {
    display: block; width: 100%; border: none; border-radius: 16px; padding: 15px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 14.5px; font-weight: 700;
    cursor: pointer; margin-top: 14px;
  }
  .cta.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .cta:active { opacity: .9; }
  .back-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #e0d3ba; background: #fffdf9; font-size: 15px; color: #5a4632; cursor: pointer; flex: 0 0 32px; }
  .stepper-head { display: flex; align-items: center; gap: 10px; padding: 4px 0 12px; }
  .progress { flex: 1; height: 5px; border-radius: 3px; background: #eee1cf; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

  .card { background: #fffdf9; border: 1px solid #eee1cf; border-radius: 18px; padding: 15px; margin-bottom: 12px; }
  .screen.role-admin .card { background: #fdfbff; border-color: #e6dced; }

  .toast { position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%); background: #171310; color: #f2e5d0; padding: 10px 16px; border-radius: 999px; font-size: 11.5px; z-index: 70; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .toast.show { opacity: 1; }

  /* ---------- customer ---------- */
  .hero { border-radius: 22px; padding: 20px 18px; color: #fff; margin: 6px 0 16px; position: relative; overflow: hidden; background: linear-gradient(135deg, #b3552d 0%, #94401f 55%, #7a3319 100%); }
  .hero .badge { position: relative; display: inline-block; background: rgba(255,255,255,.18); border-radius: 999px; padding: 4px 10px; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; margin-bottom: 10px; }
  .hero h1 { color: #fff; font-size: 21px; line-height: 1.2; }
  .hero p { color: #f4d9c4; font-size: 12.5px; margin-top: 7px; line-height: 1.4; }
  .hero .towers { position: absolute; right: -6px; bottom: -4px; opacity: .5; }
  .service-card { background: #fffdf9; border: 1px solid #eee1cf; border-radius: 18px; padding: 14px; display: flex; gap: 12px; align-items: center; margin-bottom: 10px; cursor: pointer; box-shadow: 0 1px 3px rgba(60,40,20,.05); }
  .service-card:active { transform: scale(0.98); }
  .service-icon { width: 42px; height: 42px; border-radius: 13px; flex: 0 0 42px; display: flex; align-items: center; justify-content: center; background: var(--soft); color: var(--accent); font-weight: 800; font-size: 15px; }
  .service-card h3 { font-size: 14px; color: #23180f; }
  .service-card .sub { font-size: 11.5px; color: #8d7c66; margin-top: 2px; }
  .price-pill { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--soft); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .map-card { border-radius: 18px; overflow: hidden; border: 1px solid #eee1cf; background: #efe7d3; position: relative; height: 130px; }
  .pin { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9px; font-weight: 700; color: #5a4632; }
  .point-row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #f0e7d6; }
  .point-row:last-child { border-bottom: none; }
  .dot { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex: 0 0 34px; }
  .point-row .info { line-height: 1.25; }
  .point-row .info b { font-size: 12.5px; color: #23180f; display: block; }
  .point-row .info i { font-style: normal; font-size: 10.5px; color: #8d7c66; }
  .chip-ok { margin-left: auto; font-size: 9.5px; font-weight: 700; color: #2e6b3f; background: #e2efdd; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
  .trust { display: flex; gap: 8px; margin: 14px 0; }
  .trust div { flex: 1; background: #fffdf9; border: 1px solid #eee1cf; border-radius: 14px; padding: 10px 8px; text-align: center; font-size: 10.5px; color: #5a4632; line-height: 1.35; }
  .trust b { display: block; color: #23180f; font-size: 12px; margin-bottom: 2px; }
  .field { margin-bottom: 15px; }
  .field label { font-size: 11px; font-weight: 700; color: #5a4632; letter-spacing: .04em; text-transform: uppercase; display: block; margin-bottom: 7px; }
  .input-mock { background: #fffdf9; border: 1px solid #eee1cf; border-radius: 13px; padding: 12px 13px; font-size: 13.5px; color: #23180f; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .input-mock span { color: #b6a58c; font-size: 12px; }
  .counters { display: flex; gap: 8px; margin-top: 7px; }
  .counter { flex: 1; background: #fffdf9; border: 1px solid #eee1cf; border-radius: 13px; padding: 9px 10px; display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: #23180f; }
  .counter button { width: 26px; height: 26px; border-radius: 8px; border: none; background: var(--soft); color: var(--accent); font-size: 15px; font-weight: 700; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { padding: 9px 12px; border-radius: 999px; border: 1px solid #e5d7bf; background: #fffdf9; font-size: 12px; color: #5a4632; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .chip small { display: block; font-size: 10px; opacity: .78; }
  .summary-card { background: #fffdf9; border: 1px solid #eee1cf; border-radius: 18px; padding: 16px; }
  .sum-row { display: flex; justify-content: space-between; font-size: 12.5px; color: #5a4632; padding: 5px 0; }
  .sum-row.total { border-top: 1px dashed #e0cfb2; margin-top: 8px; padding-top: 11px; font-size: 15px; font-weight: 800; color: #23180f; }
  .insured { display: flex; gap: 7px; align-items: center; font-size: 10.5px; color: #2e6b3f; background: #e2efdd; border-radius: 10px; padding: 8px 10px; margin-top: 11px; }
  .success { text-align: center; padding-top: 26px; }
  .success .check { width: 74px; height: 74px; border-radius: 50%; background: #e2efdd; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
  .code-box { background: var(--accent-ink); color: #f2e5d0; border-radius: 18px; padding: 18px; margin: 16px 0; }
  .code-box .code { font-size: 30px; font-weight: 800; letter-spacing: .32em; text-indent: .32em; font-family: "SF Mono", Consolas, monospace; }
  .code-box p { font-size: 10.5px; color: #c9b08e; margin-top: 6px; }
  .bag-card { background: #fffdf9; border: 1px solid #eee1cf; border-radius: 18px; padding: 15px; margin-bottom: 12px; }
  .bag-card .top { display: flex; justify-content: space-between; align-items: baseline; }
  .bag-card .top b { font-size: 13.5px; color: #23180f; }
  .status-tag { font-size: 10px; font-weight: 800; letter-spacing: .05em; padding: 4px 9px; border-radius: 999px; text-transform: uppercase; }
  .st-active { background: #fdf1d8; color: #a06a00; }
  .st-done { background: #e2efdd; color: #2e6b3f; }
  .timeline { margin: 13px 2px 4px; }
  .tl-step { display: flex; gap: 12px; position: relative; padding-bottom: 15px; }
  .tl-step:last-child { padding-bottom: 0; }
  .tl-step::before { content: ""; position: absolute; left: 8px; top: 20px; bottom: 2px; width: 2px; background: #eee1cf; }
  .tl-step:last-child::before { display: none; }
  .tl-step.done::before { background: var(--accent); }
  .tl-dot { width: 18px; height: 18px; border-radius: 50%; flex: 0 0 18px; border: 2px solid #e0cfb2; background: #fffdf9; margin-top: 1px; }
  .tl-step.done .tl-dot { border-color: var(--accent); background: var(--accent); }
  .tl-step.now .tl-dot { border-color: var(--accent); background: #fffdf9; box-shadow: 0 0 0 3px rgba(0,0,0,.08); }
  .tl-step b { font-size: 12.5px; color: #23180f; display: block; }
  .tl-step i { font-style: normal; font-size: 11px; color: #8d7c66; }
  .tl-step.pending b, .tl-step.pending i { opacity: .45; }
  .host-hero { background: #23180f; color: #f2e5d0; border-radius: 22px; padding: 20px 18px; margin: 6px 0 14px; }
  .host-hero h1 { color: #fff; font-size: 19px; }
  .host-hero p { color: #c9b08e; font-size: 12px; margin-top: 7px; line-height: 1.45; }
  .plan { display: flex; gap: 8px; margin-bottom: 14px; }
  .plan-card { flex: 1; border-radius: 16px; padding: 13px; border: 1px solid #eee1cf; background: #fffdf9; }
  .plan-card.featured { border: 1.5px solid #b3552d; background: #fbf1e7; position: relative; }
  .plan-card .tag { position: absolute; top: -8px; left: 12px; background: #b3552d; color: #fff; font-size: 8.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .plan-card b { font-size: 18px; color: #23180f; display: block; }
  .plan-card small { font-size: 9.5px; color: #8d7c66; line-height: 1.3; display: block; margin-top: 3px; }
  .benefit { display: flex; gap: 9px; align-items: flex-start; padding: 8px 0; font-size: 12px; color: #5a4632; line-height: 1.4; }
  .benefit .b-ico { width: 22px; height: 22px; border-radius: 7px; background: #e2efdd; color: #2e6b3f; display: flex; align-items: center; justify-content: center; font-size: 12px; flex: 0 0 22px; margin-top: 1px; }
  .stat-strip { display: flex; gap: 8px; margin: 12px 0; }
  .stat-strip div { flex: 1; text-align: center; background: #fffdf9; border: 1px solid #eee1cf; border-radius: 13px; padding: 10px 4px; }
  .stat-strip b { font-size: 15px; color: var(--accent); display: block; }
  .stat-strip small { font-size: 9px; color: #8d7c66; }

  /* ---------- partner ---------- */
  .shop-head { display: flex; align-items: center; gap: 11px; margin: 4px 0 12px; }
  .shop-avatar { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; flex: 0 0 44px; }
  .shop-head b { font-size: 15px; color: var(--accent-ink); display: block; }
  .shop-head i { font-style: normal; font-size: 11px; color: #8d7c66; }
  .cap-label { display: flex; justify-content: space-between; font-size: 11px; color: #5a4632; margin-bottom: 5px; }
  .cap-bar { height: 9px; background: #eee1cf; border-radius: 5px; overflow: hidden; }
  .cap-bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
  .ev-row { display: flex; align-items: center; gap: 10px; padding: 11px 2px; border-bottom: 1px solid #f0e7d6; }
  .ev-row:last-child { border-bottom: none; }
  .ev-time { font-size: 11px; font-weight: 800; color: var(--accent); width: 42px; flex: 0 0 42px; }
  .ev-row .info b { font-size: 12.5px; color: #23180f; display: block; }
  .ev-row .info i { font-style: normal; font-size: 10.5px; color: #8d7c66; }
  .qr-frame { position: relative; width: 190px; height: 190px; margin: 4px auto 14px; border-radius: 18px; background: #14100d; overflow: hidden; }
  .qr-frame .corner { position: absolute; width: 26px; height: 26px; border: 3px solid #5a4632; }
  .qr-frame .c1 { top: 10px; left: 10px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
  .qr-frame .c2 { top: 10px; right: 10px; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
  .qr-frame .c3 { bottom: 10px; left: 10px; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
  .qr-frame .c4 { bottom: 10px; right: 10px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }
  .scanline { position: absolute; left: 14px; right: 14px; height: 2px; background: #4ad8a0; box-shadow: 0 0 14px #4ad8a0; animation: scan 2.4s ease-in-out infinite; }
  @keyframes scan { 0% { top: 16px; } 50% { top: 170px; } 100% { top: 16px; } }
  .code-slots { display: flex; justify-content: center; gap: 8px; margin: 12px 0 16px; }
  .slot { width: 36px; height: 44px; border-radius: 10px; border: 1.5px solid #e0cfb2; background: #fffdf9; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 800; color: #23180f; font-family: "SF Mono", Consolas, monospace; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 240px; margin: 0 auto 6px; }
  .key { padding: 13px 0; border-radius: 12px; background: #fffdf9; border: 1px solid #eee1cf; font-size: 17px; font-weight: 700; color: #23180f; cursor: pointer; text-align: center; }
  .key:active { background: var(--soft); }
  .key.fn { color: var(--accent); font-size: 13px; }
  .sig-wrap { background: #fffdf9; border: 1px dashed #d8c9a8; border-radius: 14px; padding: 8px; }
  #sigpad { width: 100%; height: 120px; border-radius: 10px; background: #fff; touch-action: none; display: block; }

  /* ---------- courier & admin dark map ---------- */
  .dark-map { border-radius: 18px; overflow: hidden; position: relative; background: #1c2330; }
  .map-banner { position: absolute; left: 10px; right: 10px; bottom: 10px; background: rgba(14,19,28,.93); border-radius: 14px; padding: 10px 12px; color: #e8eef7; display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; gap: 8px; }
  .map-banner .nav-btn { background: #2456a8; border: none; color: #fff; font-size: 11px; font-weight: 700; padding: 7px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
  .pulse-dot { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; }
  .pulse-dot::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #2456a8; opacity: .3; animation: pulse 1.6s ease-out infinite; }
  .pulse-dot .core { position: absolute; inset: 10px; border-radius: 50%; background: #fff; border: 3px solid #2456a8; box-sizing: border-box; }
  @keyframes pulse { 0% { transform: scale(.5); opacity: .45; } 80% { transform: scale(1.6); opacity: 0; } 100% { opacity: 0; } }
  .stop-card { background: #fffdf9; border: 1px solid #dbe6f7; border-radius: 18px; padding: 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .stop-card.done { opacity: .55; }
  .stop-num { width: 38px; height: 38px; border-radius: 12px; background: var(--soft); color: var(--accent); font-weight: 800; display: flex; align-items: center; justify-content: center; flex: 0 0 38px; font-size: 15px; }
  .stop-card .info b { font-size: 13px; color: #12294f; display: block; }
  .stop-card .info i { font-style: normal; font-size: 11px; color: #7b87a0; display: block; margin-top: 2px; }
  .act-badge { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .act-pu { background: #dbe6f7; color: #2456a8; }
  .act-do { background: #e2efdd; color: #2e6b3f; }
  .check-step { display: flex; align-items: center; gap: 11px; padding: 11px 2px; border-bottom: 1px solid #eef2f8; font-size: 12.5px; color: #12294f; }
  .check-step:last-child { border-bottom: none; }
  .check-step .cs-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c9d6ec; background: #fff; flex: 0 0 22px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; }
  .check-step.done .cs-dot { border-color: #2456a8; background: #2456a8; }
  .check-step.pending { opacity: .45; }

  /* ---------- admin ---------- */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 12px 0; }
  .kpi { background: #fdfbff; border: 1px solid #e6dced; border-radius: 15px; padding: 13px; }
  .kpi b { font-size: 19px; color: var(--accent); display: block; }
  .kpi small { font-size: 9.5px; color: #8d7c66; letter-spacing: .03em; text-transform: uppercase; font-weight: 700; }
  .adm-row { display: flex; align-items: center; gap: 10px; padding: 11px 2px; border-bottom: 1px solid #efeaf5; }
  .adm-row:last-child { border-bottom: none; }
  .adm-row .info b { font-size: 12.5px; color: #2c1a42; display: block; }
  .adm-row .info i { font-style: normal; font-size: 10.5px; color: #8d7c66; display: block; margin-top: 1px; }
  .feed-row { display: flex; gap: 9px; padding: 8px 0; font-size: 11.5px; color: #5a4632; line-height: 1.35; }
  .feed-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: 0 0 8px; margin-top: 4px; }
  .st-chip { font-size: 9.5px; font-weight: 800; padding: 4px 9px; border-radius: 999px; margin-left: auto; white-space: nowrap; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="caption"><b>SIENABAG — MAQUETTE 4 INTERFACES</b><br />Client · Commerçant partenaire · Coursier · Administrateur — cliquez un rôle, puis explorez le smartphone.</div>
  <div class="roles">
    <div class="role-pill on" id="pill-customer" onclick="setRole('customer')">Client</div>
    <div class="role-pill" id="pill-partner" onclick="setRole('partner')">Commerçant</div>
    <div class="role-pill" id="pill-courier" onclick="setRole('courier')">Coursier</div>
    <div class="role-pill" id="pill-admin" onclick="setRole('admin')">Admin</div>
  </div>
  <div class="phone">
    <div class="screen" id="screen">
      <div class="notch"></div>
      <div class="statusbar">
        <div id="clock">9:41</div>
        <div class="icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="4.5" y="5" width="3" height="6" rx="0.8"/><rect x="9" y="2.5" width="3" height="8.5" rx="0.8"/><rect x="13.5" y="0" width="3" height="11" rx="0.8"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 4a10 10 0 0 1 14 0"/><path d="M3.5 6.8a6.5 6.5 0 0 1 9 0"/><circle cx="8" cy="9.5" r="1.2" fill="currentColor" stroke="none"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="15" height="8" rx="1.6" fill="currentColor"/><path d="M23 4v4a2.5 2.5 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>

<script>
  /* ================= ROOT ================= */
  var ROLE = { role: "customer" };
  var CLOCKS = { customer: "9:41", partner: "10:07", courier: "11:32", admin: "15:26" };
  var content = document.getElementById("content");
  var tabbar = document.getElementById("tabbar");

  function setRole(r) {
    ROLE.role = r;
    document.getElementById("screen").className = "screen role-" + r;
    document.getElementById("clock").textContent = CLOCKS[r];
    ["customer","partner","courier","admin"].forEach(function(x) {
      document.getElementById("pill-" + x).className = "role-pill" + (x === r ? " on" : "");
    });
    renderAll();
  }

  function renderAll() {
    if (ROLE.role === "customer") custRender();
    else if (ROLE.role === "partner") partRender();
    else if (ROLE.role === "courier") courRender();
    else admRender();
  }

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2300);
  }

  /* ================= CUSTOMER ================= */
  var state = {
    tab: "home", booking: null,
    flow: { step: 0, service: null, bags: 2, days: 1, slot: null, dropoff: null, address: "" },
    trips: [ demoTrip() ]
  };
  function demoTrip() {
    return { id: "SB-2481", service: "Pickup & Delivery", status: "done", step: 3,
      from: "Via Banchi di Sopra 24", to: "Siena Train Station", bags: 2, slot: "10:00 – 12:00", price: 14, code: "582 914" };
  }
  var SERVICES = {
    storage: { name: "Store your bags", price: "5.50", icon: "S", sub: "Drop off at a partner shop, explore hands-free" },
    delivery: { name: "Pickup & Delivery", price: "14", icon: "D", sub: "We collect at your place, deliver where you choose" },
    airport: { name: "Airport Transfer", price: "29", icon: "A", sub: "From your doorstep to the airport terminal" }
  };
  var SLOTS = ["9:00 – 11:00", "10:00 – 12:00", "12:00 – 14:00", "15:00 – 17:00", "17:00 – 19:00"];
  var DROPOFFS = {
    storage: [
      { id: "gramsci", label: "Piazza Gramsci", note: "Bus terminal · Tabaccheria la Lizza · 270 m", price: 0 },
      { id: "campo", label: "Piazza del Campo", note: "Waterland · Via dei Rossi · 350 m", price: 0 },
      { id: "station", label: "Siena Train Station", note: "Bar Duomo d'Oro · 120 m", price: 0 }
    ],
    delivery: [
      { id: "station", label: "Siena Train Station", note: "Meet your courier at platform exit", price: 0 },
      { id: "gramsci", label: "Piazza Gramsci terminal", note: "Bus terminal meeting point", price: 0 },
      { id: "hotel", label: "Another address in Siena", note: "Hotels, B&Bs, apartments", price: 0 }
    ],
    airport: [
      { id: "flo", label: "Florence Airport (FLR)", note: "Meeting point · Terminal exit", price: 29 },
      { id: "psa", label: "Pisa Airport (PSA)", note: "Meeting point · Terminal 1", price: 35 }
    ]
  };
  function computePrice() {
    var s = state.flow; var svc = s.service;
    if (!svc) return 0;
    var extra = Math.max(0, s.bags - 3);
    if (svc === "storage") return 5.5 * s.bags * s.days;
    if (svc === "delivery") return 14 + extra * 4;
    var d = DROPOFFS.airport.filter(function(x){ return x.id === s.dropoff; })[0];
    return (d ? d.price : 29) + extra * 8;
  }
  var CUST_TABS = [
    { id: "home", label: "Home", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V21h5.5v-5h3v5H19V9.8"/></svg>' },
    { id: "book", label: "Book", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M8 11h8M8 15h5"/></svg>' },
    { id: "trips", label: "My Bags", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="7" width="14" height="13" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>' },
    { id: "host", label: "Hosts", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21V10l9-6 9 6v11"/><path d="M9 21v-6h6v6"/></svg>' }
  ];
  function custSetTab(id) { state.tab = id; if (id === "book" && state.flow.step === 4) state.flow.step = 0; custRender(); }
  function custRender() {
    tabbar.innerHTML = CUST_TABS.map(function(t) {
      return '<div class="tab ' + (state.tab === t.id ? "active" : "") + '" onclick="custSetTab(\'' + t.id + '\')">' + t.icon + "<span>" + t.label + "</span></div>";
    }).join("");
    if (state.tab === "home") custHome();
    else if (state.tab === "book") custFlow();
    else if (state.tab === "trips") custTrips();
    else custHost();
    content.scrollTop = 0;
  }
  function custHome() {
    content.innerHTML =
      '<h1>Ciao, traveller</h1><p class="muted" style="margin:4px 0 10px;">Siena without the weight.</p>' +
      '<div class="hero"><span class="badge">SIENA · TODAY</span><h1>Check-out at 10.<br/>Train at 17? Enjoy Siena hands-free.</h1>' +
      "<p>We collect your bags, keep them insured, and deliver them to the station, the bus terminal or your hotel.</p>" +
      '<svg class="towers" width="120" height="90" viewBox="0 0 120 90" fill="#fff"><path d="M20 90V38h18v52z"/><path d="M32 38V20h8v18"/><rect x="26" y="30" width="6" height="6"/><rect x="26" y="46" width="6" height="6"/><rect x="26" y="62" width="6" height="6"/><path d="M70 90V30h22v60z"/><path d="M79 30V12h4v18"/><rect x="74" y="40" width="6" height="6"/><rect x="84" y="40" width="6" height="6"/><rect x="74" y="56" width="6" height="6"/><rect x="84" y="56" width="6" height="6"/><rect x="74" y="72" width="6" height="6"/><rect x="84" y="72" width="6" height="6"/></svg></div>' +
      '<div class="section-title">Our services</div>' + custServiceCards() + custTrust() +
      '<div class="section-title">Storage points near you <span>See map</span></div>' + custMap() +
      '<div style="background:#fffdf9;border:1px solid #eee1cf;border-radius:18px;padding:6px 14px;margin-top:10px;">' +
      custPoint("T", "Tabaccheria la Lizza", "Piazza Gramsci 15A · Terminal bus", "4 min walk") +
      custPoint("W", "Waterland Laundromat", "Via dei Rossi 94 · San Francesco", "6 min walk") +
      custPoint("S", "Bar Duomo d'Oro", "Piazza del Campo area", "3 min walk") + "</div>";
  }
  function custServiceCards() {
    return Object.keys(SERVICES).map(function(k) {
      var s = SERVICES[k];
      return '<div class="service-card" onclick="custChoose(\'' + k + '\')">' +
        '<div class="service-icon">' + s.icon + "</div><div><h3>" + s.name + '</h3><div class="sub">' + s.sub + "</div></div>" +
        '<div class="price-pill">from \u20AC' + s.price + "</div></div>";
    }).join("");
  }
  function custTrust() {
    return '<div class="trust"><div><b>\u20AC2,500</b>insured per bag</div><div><b>4.9 \u2605</b>1,240 reviews</div><div><b>6 pts</b>inside the walls</div></div>';
  }
  function custMap() {
    return '<div class="map-card"><svg width="100%" height="100%" viewBox="0 0 340 130" preserveAspectRatio="xMidYMid slice">' +
      '<rect width="340" height="130" fill="#efe7d3"/><path d="M0 78 Q60 70 120 82 T230 76 T340 84 V130 H0 Z" fill="#e5d9bd"/>' +
      '<path d="M30 0 Q60 50 40 130" stroke="#dccfa9" stroke-width="9" fill="none"/><path d="M340 10 Q260 60 300 130" stroke="#dccfa9" stroke-width="7" fill="none"/>' +
      '<path d="M120 130 Q160 70 130 0" stroke="#dccfa9" stroke-width="6" fill="none"/><circle cx="170" cy="55" r="34" fill="#d9c9a4" opacity="0.55"/></svg>' +
      pin("18%","52%","#b3552d","Gramsci") + pin("47%","30%","#2e6b3f","Station") + pin("66%","44%","#a06a00","Campo") + "</div>";
  }
  function pin(l, t, c, label) {
    return '<div class="pin" style="left:' + l + ";top:" + t + ';"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 0a6 6 0 0 0-6 6c0 4.5 6 10 6 10s6-5.5 6-10a6 6 0 0 0-6-6z" fill="' + c + '"/><circle cx="8" cy="6" r="2.3" fill="#fff"/></svg>' + label + "</div>";
  }
  function custPoint(letter, name, addr, walk) {
    return '<div class="point-row"><div class="dot">' + letter + "</div><div class=\"info\"><b>" + name + "</b><i>" + addr + "</i></div><span class=\"chip-ok\">" + walk + "</span></div>";
  }
  function custChoose(k) { state.tab = "book"; state.flow = { step: 1, service: k, bags: 2, days: 1, slot: null, dropoff: null, address: "" }; custRender(); }
  function custFlow() {
    var f = state.flow;
    if (f.step === 0) { content.innerHTML = '<h1>Book a service</h1><p class="muted" style="margin:4px 0 12px;">What do you need today?</p>' + custServiceCards(); return; }
    var head = '<div class="stepper-head"><button class="back-btn" onclick="custBack()">\u2039</button><div class="progress"><i style="width:' + (f.step * 33.4) + '%"></i></div></div>';
    if (f.step === 1) content.innerHTML = head + custStep1();
    else if (f.step === 2) content.innerHTML = head + custStep2();
    else if (f.step === 3) content.innerHTML = head + custStep3();
    else content.innerHTML = custStep4();
  }
  function custStep1() {
    var f = state.flow; var s = SERVICES[f.service];
    var html = "<h2>" + s.name + "</h2><p class='muted' style='margin:3px 0 14px;'>" + s.sub + ".</p>";
    if (f.service === "storage") {
      html += '<div class="field"><label>Storage point</label>' + custChips(DROPOFFS.storage, "dropoff") + "</div>" +
        '<div class="field"><label>How many bags?</label><div class="counters"><div class="counter"><button onclick="custBag(-1)">\u2212</button><span>' + f.bags + "</span><button onclick=\"custBag(1)\">+</button></div></div></div>" +
        '<div class="field"><label>How many days?</label><div class="counters"><div class="counter"><button onclick="custDay(-1)">\u2212</button><span>' + f.days + "</span><button onclick=\"custDay(1)\">+</button></div></div></div>";
    } else {
      html += '<div class="field"><label>Pickup address</label><div class="input-mock" onclick="custAddr()">' + (f.address ? f.address : "<span>\u2315 Where do we collect your bags?</span>") + "</div></div>" +
        '<div class="field"><label>How many bags?</label><div class="counters"><div class="counter"><button onclick="custBag(-1)">\u2212</button><span>' + f.bags + "</span><button onclick=\"custBag(1)\">+</button></div></div></div>" +
        '<div class="field"><label>Choose a time window</label>' + custSlotChips() + "</div>";
    }
    var ok = f.service === "storage" ? !!f.dropoff : (!!f.slot && !!f.address);
    html += '<button class="cta" onclick="custNext()" style="opacity:' + (ok ? 1 : 0.45) + '">' + (ok ? "Continue" : "Please complete above") + "</button>";
    return html;
  }
  function custStep2() {
    var f = state.flow;
    return "<h2>Where should we " + (f.service === "storage" ? "store them" : "deliver them") + "?</h2><p class='muted' style='margin:3px 0 14px;'>Choose the handover point.</p>" +
      '<div class="field">' + custChips(DROPOFFS[f.service], "dropoff", true) + "</div>" +
      (f.service === "storage" ? '<div class="field"><label>Pickup time for return</label>' + custSlotChips() + "</div>" : "") +
      '<button class="cta" onclick="custNext()" style="opacity:' + (f.dropoff ? 1 : 0.45) + '">Review &amp; pay</button>';
  }
  function custStep3() {
    var f = state.flow; var p = computePrice(); var s = SERVICES[f.service];
    var d = DROPOFFS[f.service].filter(function(x){ return x.id === f.dropoff; })[0];
    var rows;
    if (f.service === "storage") rows = custSum(s.name + " \u00b7 " + f.bags + " bag" + (f.bags > 1 ? "s" : "") + " \u00d7 " + f.days + " day" + (f.days > 1 ? "s" : ""), 5.5 * f.bags * f.days) + custSum("Insurance & coverage", 0);
    else if (f.service === "delivery") rows = custSum("Pickup & delivery \u00b7 " + f.bags + " bag" + (f.bags > 1 ? "s" : ""), 14) + (f.bags > 3 ? custSum("Extra bags (" + (f.bags - 3) + " \u00d7 \u20AC4)", (f.bags - 3) * 4) : "") + custSum("Insurance & coverage", 0);
    else rows = custSum("Airport transfer \u00b7 " + d.label, d.price) + (f.bags > 3 ? custSum("Extra bags (" + (f.bags - 3) + " \u00d7 \u20AC8)", (f.bags - 3) * 8) : "") + custSum("Insurance & coverage", 0);
    return "<h2>Confirm your booking</h2><p class='muted' style='margin:3px 0 14px;'>No payment taken in this demo.</p>" +
      '<div class="summary-card">' + custSum("Service", s.name) + (f.address ? custSum("Pickup", f.address) : "") +
      custSum("Drop-off", d ? d.label : "\u2014") + (f.slot ? custSum("Window", f.slot) : "") + custSum("Bags", "" + f.bags) +
      '<div style="height:8px"></div>' + rows +
      '<div class="sum-row total"><span>Total</span><span>\u20AC' + p.toFixed(2) + "</span></div>" +
      '<div class="insured"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/></svg>Every bag insured up to \u20AC2,500 \u00b7 sealed &amp; photographed</div></div>' +
      '<button class="cta" onclick="custConfirm()">Confirm &amp; pay \u20AC' + p.toFixed(2) + "</button>";
  }
  function custStep4() {
    var b = state.booking;
    return '<div class="success"><div class="check"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2e6b3f" stroke-width="2.6"><path d="m4.5 12.5 5 5 10-11"/></svg></div>' +
      "<h2>Booking confirmed!</h2><p class='muted' style='margin-top:4px;'>" + b.to + " \u00b7 " + b.slot + "</p>" +
      '<div class="code-box"><div class="code">' + b.code + "</div><p>Show this code to your courier or at the storage point</p></div>" +
      '<div class="muted">SMS and tracking link sent to your phone.</div><button class="cta" onclick="custSetTab(\'trips\')">Track my bags</button></div>';
  }
  function custSum(k, v) {
    if (v === 0) return '<div class="sum-row"><span>' + k + '</span><span style="color:#2e6b3f;font-weight:700">Included</span></div>';
    return '<div class="sum-row"><span>' + k + "</span><span>" + (typeof v === "number" ? "\u20AC" + v.toFixed(2) : v) + "</span></div>";
  }
  function custChips(list, field, withPrice) {
    return '<div class="chips">' + list.map(function(o) {
      var on = state.flow[field] === o.id ? "on" : "";
      return '<div class="chip ' + on + '" onclick="custFlowSet(\'' + field + '\',\'' + o.id + '\')"><b>' + o.label + "</b>" +
        (withPrice && o.price ? " <small>\u20AC" + o.price + "</small>" : "<small>" + o.note + "</small>") + "</div>";
    }).join("") + "</div>";
  }
  function custSlotChips() {
    return '<div class="chips">' + SLOTS.map(function(s) {
      return '<div class="chip ' + (state.flow.slot === s ? "on" : "") + '" onclick="custFlowSet(\'slot\',\'' + s + '\')">' + s + "</div>";
    }).join("") + "</div>";
  }
  function custFlowSet(k, v) { state.flow[k] = v; custRender(); }
  function custBag(d) { state.flow.bags = Math.max(1, state.flow.bags + d); custRender(); }
  function custDay(d) { state.flow.days = Math.max(1, state.flow.days + d); custRender(); }
  function custAddr() { state.flow.address = "Via Banchi di Sopra 24 (your apartment)"; custRender(); }
  function custNext() {
    var f = state.flow; var ok;
    if (f.step === 1) ok = f.service === "storage" ? !!f.dropoff : (!!f.slot && !!f.address);
    else if (f.step === 2) ok = !!f.dropoff && (f.service !== "storage" || !!f.slot);
    else ok = true;
    if (!ok) { toast("Please complete the missing choice"); return; }
    f.step = Math.min(3, f.step + 1); custRender();
  }
  function custBack() { state.flow.step = Math.max(0, state.flow.step - 1); if (state.flow.step === 0) state.tab = "home"; custRender(); }
  function custConfirm() {
    var f = state.flow;
    var d = DROPOFFS[f.service].filter(function(x){ return x.id === f.dropoff; })[0];
    state.booking = { id: "SB-" + (2500 + Math.floor(Math.random() * 90)), service: SERVICES[f.service].name, status: "active", step: 0,
      from: f.address || "Your hands \u00b7 self drop-off", to: d ? d.label : "\u2014", bags: f.bags, slot: f.slot || "Flexible",
      price: computePrice(), code: String(Math.floor(100 + Math.random() * 900)) + " " + String(Math.floor(1000 + Math.random() * 9000)) };
    f.step = 4; custRender(); toast("Payment simulated \u2014 demo only");
  }
  function custTrips() {
    var list = state.booking ? [state.booking].concat(state.trips) : state.trips;
    content.innerHTML = "<h1>My bags</h1>" + list.map(function(b, i) { return custTripCard(b, i === 0 && !!state.booking); }).join("");
  }
  function custTripCard(b, isNew) {
    var TL = [ { t: "Booked", i: b.slot }, { t: "Picked up", i: "Courier verified with photo & seal" }, { t: "In secure storage", i: "Waterland hub \u00b7 Via dei Rossi" }, { t: "Delivered", i: b.to } ];
    var tl = TL.map(function(s, i) {
      var cls = i < b.step ? "done" : (i === b.step ? "now" : "pending");
      return '<div class="tl-step ' + cls + '"><div class="tl-dot"></div><div><b>' + s.t + "</b><i>" + (i <= b.step ? s.i : "Pending") + "</i></div></div>";
    }).join("");
    return '<div class="bag-card"><div class="top"><b>' + b.service + " \u00b7 " + b.bags + " bag" + (b.bags > 1 ? "s" : "") + '</b><span class="status-tag ' + (b.status === "active" ? "st-active" : "st-done") + '">' + (b.status === "active" ? "In progress" : "Delivered") + "</span></div>" +
      '<p class="muted" style="margin-top:5px;">' + b.from + " \u2192 " + b.to + " \u00b7 \u20AC" + b.price.toFixed(2) + "</p>" +
      '<div class="timeline">' + tl + "</div>" +
      '<div class="code-box" style="padding:12px 14px;"><div class="code" style="font-size:19px;">' + b.code + "</div><p>Handover code</p></div>" +
      (isNew ? '<button class="cta" onclick="custAdvance()">Simulate next step (demo)</button>' : "") + "</div>";
  }
  function custAdvance() {
    var b = state.booking;
    if (b && b.step < 3) { b.step++; custRender(); toast("Status: " + ["Picked up", "In secure storage", "Delivered"][b.step - 1]); }
    else if (b) { b.status = "done"; custRender(); toast("Bag delivered \u2014 enjoy your day!"); }
  }
  function custHost() {
    content.innerHTML = '<div class="host-hero"><h1>SienaBag for Hosts</h1><p>Offer five-star hands-free check-out to your guests. We handle their bags, your reviews do the rest.</p></div>' +
      '<div class="plan"><div class="plan-card"><b>\u20AC0</b><small>Per-use referral \u00b7 guest pays</small></div>' +
      '<div class="plan-card featured"><span class="tag">MOST POPULAR</span><b>\u20AC39<small style="font-size:11px">/month</small></b><small>Unlimited check-outs, priority slots, mention on your listing</small></div></div>' +
      '<div class="section-title">What you get</div>' +
      '<div class="benefit"><div class="b-ico">\u2713</div><div>Guests drop bags at check-out, reclaim them at station, bus or airport</div></div>' +
      '<div class="benefit"><div class="b-ico">\u2713</div><div>Sealed, photographed, insured up to \u20AC2,500 per bag</div></div>' +
      '<div class="benefit"><div class="b-ico">\u2713</div><div>Real-time tracking link sent to your guest</div></div>' +
      '<div class="benefit"><div class="b-ico">\u2713</div><div>Listing badge &amp; welcome-message template included</div></div>' +
      '<div class="section-title">Your season so far</div>' +
      '<div class="stat-strip"><div><b>27</b><small>guests served</small></div><div><b>4.9\u2605</b><small>their avg rating</small></div><div><b>3</b><small>reviews mentioning it</small></div></div>' +
      '<button class="cta" onclick="toast(\'Demo \u2014 pilot list signup simulated\')">Start free pilot season</button>';
  }

  /* ================= PARTNER (commerçant) ================= */
  var pstate = {
    tab: "oggi", code: "", found: null, view: "list",
    cap: { used: 14, total: 20 },
    events: [
      { time: "10:15", name: "M. Dupont", bags: 2, svc: "Deposito \u00b7 1 giorno", code: "582 914", type: "in arrivo" },
      { time: "11:40", name: "S. Meyer", bags: 1, svc: "Deposito \u00b7 2 giorni", code: "771 203", type: "in arrivo" },
      { time: "14:30", name: "A. Rossi", bags: 2, svc: "Pickup & Delivery", code: "124 076", type: "da consegnare" }
    ]
  };

  var ADM_TABS = [
    { id: "live", label: "Live", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>' },
    { id: "ordini", label: "Ordres", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M8 11h8M8 15h5"/></svg>' },
    { id: "partner", label: "Partenaires", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21V10l9-6 9 6v11"/><path d="M9 21v-6h6v6"/></svg>' },
    { id: "team", label: "\u00c9quipe", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/><path d="M17 8.5a3 3 0 1 1 2 5"/></svg>' }
  ];
  function admSetTab(id) { astate.tab = id; astate.sel = -1; admRender(); }
  function admRender() {
    tabbar.innerHTML = ADM_TABS.map(function(t) {
      return '<div class="tab ' + (astate.tab === t.id ? "active" : "") + '" onclick="admSetTab(\'' + t.id + '\')">' + t.icon + "<span>" + t.label + "</span></div>";
    }).join("");
    if (astate.tab === "live") admLive();
    else if (astate.tab === "ordini") admOrdini();
    else if (astate.tab === "partner") admPartners();
    else admTeam();
    content.scrollTop = 0;
  }
  function admLive() {
    content.innerHTML = "<h1>Vue temps r\u00e9el</h1><p class='muted' style='margin:4px 0 8px;'>Sienne \u00b7 vendredi \u00b7 saison haute</p>" +
      '<div class="kpi-grid">' +
      '<div class="kpi"><small>En transit</small><b>12</b></div>' +
      '<div class="kpi"><small>En d\u00e9p\u00f4t</small><b>34</b></div>' +
      '<div class="kpi"><small>Coursiers actifs</small><b>3</b></div>' +
      '<div class="kpi"><small>CA du jour</small><b>482 \u20AC</b></div></div>' +
      '<div class="section-title">Carte op\u00e9rationnelle</div>' +
      '<div class="dark-map" style="height:230px;"><svg width="100%" height="100%" viewBox="0 0 340 230" preserveAspectRatio="xMidYMid slice">' +
      '<rect width="340" height="230" fill="#1c2330"/>' +
      '<path d="M0 60 Q100 45 170 65 T340 50" stroke="#2c3648" stroke-width="9" fill="none"/>' +
      '<path d="M0 140 Q120 130 180 150 T340 130" stroke="#2c3648" stroke-width="9" fill="none"/>' +
      '<path d="M70 0 Q80 90 60 170 T80 230" stroke="#2c3648" stroke-width="7" fill="none"/>' +
      '<path d="M250 0 Q240 70 260 140 T240 230" stroke="#2c3648" stroke-width="7" fill="none"/>' +
      '<circle cx="80" cy="100" r="7" fill="#2e6b3f"/><circle cx="160" cy="150" r="7" fill="#2e6b3f"/><circle cx="240" cy="70" r="7" fill="#2e6b3f"/>' +
      '<circle cx="120" cy="60" r="6" fill="#2456a8"/><circle cx="210" cy="120" r="6" fill="#2456a8"/><circle cx="280" cy="160" r="6" fill="#2456a8"/>' +
      '<circle cx="180" cy="90" r="6" fill="#b3552d"/><circle cx="60" cy="180" r="6" fill="#b3552d"/>' +
      "</svg>" +
      '<div style="position:absolute;top:10px;right:10px;background:rgba(14,19,28,.9);border-radius:10px;padding:8px 10px;font-size:9px;color:#e8eef7;line-height:1.7;">' +
      '<span style="color:#2e6b3f">\u25CF</span> partenaires &nbsp;<span style="color:#2456a8">\u25CF</span> coursiers &nbsp;<span style="color:#b3552d">\u25CF</span> colis</div></div>' +
      '<div class="section-title">Flux d\u2019activit\u00e9</div>' +
      '<div class="card" style="padding:6px 14px;">' + astate.feed.map(function(f) {
        return '<div class="feed-row"><div class="feed-dot"></div><div><b>' + f.t + "</b> \u2014 " + f.m + "</div></div>";
      }).join("") + "</div>" +
      '<button class="cta" onclick="toast(\'Panneau de pilotage complet \u2014 d\u00e9mo\')">Ouvrir le pilotage complet</button>';
  }
  function admOrdini() {
    if (astate.sel >= 0) return admOrderDetail();
    content.innerHTML = "<h1>Ordres du jour</h1><p class='muted' style='margin:4px 0 10px;'>47 unit\u00e9s de service vendues aujourd'hui.</p>" +
      astate.orders.map(function(o, i) {
        return '<div class="card" style="display:flex;align-items:center;gap:10px;cursor:pointer;" onclick="admOpen(' + i + ')">' +
          '<div class="stop-num">' + o.svc[0] + "</div><div class=\"info\"><b style=\"font-size:12.5px;color:#2c1a42;display:block;\">" + o.id + " \u00b7 " + o.cust + "</b>" +
          '<i style="font-style:normal;font-size:10.5px;color:#8d7c66;">' + o.svc + " \u2192 " + o.to + " \u00b7 \u20AC" + o.price.toFixed(2) + "</i></div>" +
          '<span class="st-chip" style="background:var(--soft);color:var(--accent);">' + o.status + "</span></div>";
      }).join("");
  }
  function admOpen(i) { astate.sel = i; admRender(); }
  function admOrderDetail() {
    var o = astate.orders[astate.sel];
    var TL = [ { t: "R\u00e9serv\u00e9", i: o.id + " \u00b7 pay\u00e9 en ligne" }, { t: "Collect\u00e9", i: "Coursier \u00b7 photo + scell\u00e9" }, { t: "En stockage", i: o.partner || "Hub Waterland" }, { t: "Livré", i: o.to } ];
    var tl = TL.map(function(s, i) {
      var cls = i < o.step ? "done" : (i === o.step ? "now" : "pending");
      return '<div class="tl-step ' + cls + '"><div class="tl-dot"></div><div><b>' + s.t + "</b><i>" + (i <= o.step ? s.i : "En attente") + "</i></div></div>";
    }).join("");
    content.innerHTML = '<div class="stepper-head"><button class="back-btn" onclick="admSetTab(\'ordini\')">\u2039</button><div class="progress"><i style="width:100%"></i></div></div>' +
      "<h2>" + o.id + " \u00b7 " + o.cust + "</h2><p class='muted' style='margin:3px 0 12px;'>" + o.svc + " \u2192 " + o.to + "</p>" +
      '<div class="card"><div class="timeline">' + tl + "</div></div>" +
      '<div class="card" style="padding:6px 14px;">' +
      '<div class="adm-row"><div class="info"><b>Prix client</b></div><span style="font-weight:800;color:#2c1a42;">\u20AC' + o.price.toFixed(2) + "</span></div>" +
      '<div class="adm-row"><div class="info"><b>Intervenant</b><i>' + (o.courier || o.partner) + "</i></div><span class=\"st-chip\" style=\"background:var(--soft);color:var(--accent);\">" + o.status + "</span></div></div>" +
      '<button class="cta ghost" onclick="toast(\'R\u00e9affectation simul\u00e9e\')">R\u00e9affecter \u00e0 un autre coursier</button>';
  }
  function admPartners() {
    content.innerHTML = "<h1>Points partenaires</h1><p class='muted' style='margin:4px 0 10px;'>6 points actifs \u00b7 3 \u00e0 recruter (gare nord, Duomo est).</p>" +
      astate.partners.map(function(p) {
        var pct = Math.round(p.used / p.cap * 100);
        return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;"><b style="font-size:13px;color:#2c1a42;">' + p.name + "</b><span class=\"muted\" style=\"font-size:10px;\">" + p.where + "</span></div>" +
          '<div class="cap-label" style="margin-top:9px;"><span>Occupation</span><span>' + p.used + "/" + p.cap + " (" + pct + "%)</span></div>" +
          '<div class="cap-bar"><i style="width:' + pct + '%"></i></div>' +
          '<div class="stat-strip" style="margin-bottom:0;"><div><b>' + p.month + "</b><small>bagages / mois</small></div><div><b>\u20AC" + (p.month * 5.5 * 0.35).toFixed(0) + "</b><small>quota vers\u00e9e</small></div><div><b>" + (pct > 80 ? "\u26A0" : "\u2713") + "</b><small>" + (pct > 80 ? "capacit\u00e9 tendue" : "capacit\u00e9 ok") + "</small></div></div></div>";
      }).join("");
  }
  function admTeam() {
    content.innerHTML = "<h1>Coursiers</h1><p class='muted' style='margin:4px 0 10px;'>Tourn\u00e9es du jour \u00b7 cargo-bikes et v\u00e9los \u00e9lectriques.</p>" +
      astate.couriers.map(function(c) {
        return '<div class="card" style="display:flex;align-items:center;gap:11px;">' +
          '<div class="stop-num" style="border-radius:50%;">' + c.name[0] + "</div><div class=\"info\"><b style=\"font-size:13px;color:#2c1a42;display:block;\">" + c.name + "</b>" +
          '<i style="font-style:normal;font-size:10.5px;color:#8d7c66;">' + c.now + " \u00b7 " + c.done + " tappe(s) faite(s)</i></div>" +
          '<span class="st-chip" style="background:' + (c.status === "Pause" ? "#fdf1d8;color:#a06a00" : "var(--soft);color:var(--accent)") + ';">' + c.status + "</span></div>";
      }).join("") +
      '<div class="section-title">Recrutement</div>' +
      '<div class="card"><p class="muted">Saison haute : 2 coursiers suppl\u00e9mentaires \u00e0 planifier pour couvrir les pics de juillet et le Palio (16 ao\u00fbt).</p>' +
      '<button class="cta ghost" onclick="toast(\'Offre de mission saisonni\u00e8re pr\u00e9par\u00e9e \u2014 d\u00e9mo\')">Pr\u00e9parer une offre saisonni\u00e8re</button></div>';
  }

  /* ================= INIT ================= */
  renderAll();
</script>
</body>
</html>
